services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labprice
      POSTGRES_PASSWORD: labprice
      POSTGRES_DB: labprice
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - labprice-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labprice"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    networks:
      - labprice-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: builder
    # No Prisma migrations exist (schema uses `db push`). Create tables, then apply the core raw DDL
    # (extensions + citext + FTS search_vector), then seed. See DEPLOY.md / docs/database/ddl-core.sql.
    command: >
      sh -c "cd packages/database &&
             pnpm exec prisma db push --skip-generate &&
             pnpm exec prisma db execute --schema prisma/schema.prisma --file ../../docs/database/ddl-core.sql &&
             pnpm exec tsx prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://labprice:labprice@postgres:5432/labprice
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - labprice-net

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://labprice:labprice@postgres:5432/labprice
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - labprice-net

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://labprice:labprice@postgres:5432/labprice
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - labprice-net

networks:
  labprice-net:

volumes:
  postgres-data:
  redis-data:
