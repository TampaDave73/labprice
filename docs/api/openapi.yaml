# ── Components ──────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Cursor for pagination (opaque string from previous response)
    limit:
      name: limit
      in: query
      schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      description: Number of results per page

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    Money:
      type: string
      pattern: "^\\d+\\.\\d{2}$"
      description: Decimal string (e.g. "29.00")
      examples: ["29.00", "54.99"]

    SessionResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        expiresAt: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        role: { type: string, enum: [USER, EDITOR, ADMIN, SUPER_ADMIN] }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        displayOrder: { type: integer }
        colorBg: { type: string }
        colorText: { type: string }
        testCount: { type: integer }

    TestCode:
      type: object
      properties:
        codeType: { type: string, enum: [QUEST, LABCORP] }
        codeValue: { type: string }

    TestSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
        slug: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        codes: { type: array, items: { $ref: "#/components/schemas/TestCode" } }
        minPrice: { $ref: "#/components/schemas/Money" }
        vendorCount: { type: integer }
        isPopular: { type: boolean }

    TestDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
        slug: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        codes: { type: array, items: { $ref: "#/components/schemas/TestCode" } }
        description: { type: string }
        purpose: { type: string }
        procedure: { type: string }
        preparation: { type: string }
        normalRange: { type: string }
        isPopular: { type: boolean }
        offerings:
          type: array
          items: { $ref: "#/components/schemas/Offering" }
        biomarkers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              unit: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TestInput:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        shortName: { type: string, maxLength: 50 }
        categoryId: { type: string }
        description: { type: string, maxLength: 2000 }
        purpose: { type: string, maxLength: 2000 }
        procedure: { type: string, maxLength: 2000 }
        preparation: { type: string, maxLength: 2000 }
        normalRange: { type: string, maxLength: 500 }
        questCode: { type: string, maxLength: 20 }
        labcorpCode: { type: string, maxLength: 20 }
        isPopular: { type: boolean }
        displayOrder: { type: integer }

    Offering:
      type: object
      properties:
        id: { type: string }
        testId: { type: string }
        vendor: { $ref: "#/components/schemas/Vendor" }
        currentPrice: { $ref: "#/components/schemas/Money" }
        previousPrice: { $ref: "#/components/schemas/Money" }
        priceUpdatedAt: { type: string, format: date-time }
        externalUrl: { type: string, format: uri }
        isActive: { type: boolean }
        isCheapest: { type: boolean }

    OfferingInput:
      type: object
      properties:
        testId: { type: string }
        vendorId: { type: string }
        currentPrice: { $ref: "#/components/schemas/Money" }
        externalUrl: { type: string, format: uri }
        isActive: { type: boolean }

    Vendor:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        websiteUrl: { type: string, format: uri }
        logoUrl: { type: string, nullable: true }
        isActive: { type: boolean }
        trustLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        offeringCount: { type: integer }

    VendorInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        websiteUrl: { type: string, format: uri }
        affiliateUrlTemplate: { type: string }
        logoUrl: { type: string }
        isActive: { type: boolean }
        trustLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }

    Suggestion:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }
        category: { type: string }
        codes: { type: string }
        minPrice: { $ref: "#/components/schemas/Money" }

    TrendPoint:
      type: object
      properties:
        date: { type: string, format: date }
        vendorId: { type: string }
        vendorName: { type: string }
        price: { $ref: "#/components/schemas/Money" }

    PriceAlert:
      type: object
      properties:
        id: { type: string }
        testId: { type: string }
        testName: { type: string }
        vendorId: { type: string, nullable: true }
        vendorName: { type: string, nullable: true }
        targetPrice: { $ref: "#/components/schemas/Money" }
        thresholdPercent: { type: integer, nullable: true }
        isActive: { type: boolean }
        lastTriggeredAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    AlertNotification:
      type: object
      properties:
        id: { type: string }
        alertId: { type: string }
        testName: { type: string }
        vendorName: { type: string }
        triggeredPrice: { $ref: "#/components/schemas/Money" }
        channel: { type: string, enum: [EMAIL, PUSH] }
        sentAt: { type: string, format: date-time }

    StagedChange:
      type: object
      properties:
        id: { type: string }
        offeringId: { type: string }
        testName: { type: string }
        vendorName: { type: string }
        vendorTrustLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        oldPrice: { $ref: "#/components/schemas/Money" }
        newPrice: { $ref: "#/components/schemas/Money" }
        percentChange: { type: number }
        scrapedAt: { type: string, format: date-time }
        scrapeRunId: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, AUTO_APPROVED, EXPIRED] }
        reviewedBy: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewNote: { type: string, nullable: true }

    ScrapeConfig:
      type: object
      properties:
        id: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        engine: { type: string, enum: [PLAYWRIGHT, SELENIUM, HTTP] }
        baseUrl: { type: string, format: uri }
        selectors: { type: object }
        scheduleCron: { type: string, nullable: true }
        isEnabled: { type: boolean }
        maxRetries: { type: integer }
        timeoutMs: { type: integer }

    ScrapeConfigInput:
      type: object
      properties:
        engine: { type: string, enum: [PLAYWRIGHT, SELENIUM, HTTP] }
        baseUrl: { type: string, format: uri }
        selectors: { type: object }
        authConfig: { type: object }
        scheduleCron: { type: string }
        isEnabled: { type: boolean }
        maxRetries: { type: integer, minimum: 0, maximum: 10 }
        timeoutMs: { type: integer, minimum: 1000, maximum: 120000 }

    ScrapeJob:
      type: object
      properties:
        id: { type: string }
        vendorId: { type: string, nullable: true }
        vendorName: { type: string, nullable: true }
        triggeredBy: { type: string, enum: [SCHEDULE, MANUAL, RETRY] }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, CANCELLED] }
        scheduledAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        errorMessage: { type: string, nullable: true }
        runs:
          type: array
          items: { $ref: "#/components/schemas/ScrapeRun" }

    ScrapeRun:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        vendorId: { type: string }
        vendorName: { type: string }
        status: { type: string, enum: [RUNNING, COMPLETED, PARTIAL, FAILED] }
        testsFound: { type: integer }
        pricesUpdated: { type: integer }
        pricesUnchanged: { type: integer }
        errorsCount: { type: integer }
        durationMs: { type: integer }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ScrapeResult:
      type: object
      properties:
        id: { type: string }
        testName: { type: string }
        scrapedPrice: { $ref: "#/components/schemas/Money" }
        currentPrice: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [MATCHED, NEW, SKIPPED, ERROR] }

    ScrapeError:
      type: object
      properties:
        id: { type: string }
        runId: { type: string }
        vendorName: { type: string }
        errorType: { type: string, enum: [TIMEOUT, BLOCKED, SELECTOR_MISS, PARSE_FAIL, ANOMALY, NETWORK, AUTH_FAIL] }
        message: { type: string }
        url: { type: string }
        screenshotPath: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    SeoPage:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        metaDescription: { type: string }
        heading: { type: string }
        bodyHtml: { type: string }
        testId: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SeoPageInput:
      type: object
      properties:
        slug: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        metaDescription: { type: string, maxLength: 300 }
        heading: { type: string, maxLength: 200 }
        bodyHtml: { type: string }
        testId: { type: string, nullable: true }
        categoryId: { type: string, nullable: true }
        isPublished: { type: boolean }

    FeatureFlag:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        description: { type: string }
        isEnabled: { type: boolean }
        payload: { type: object, nullable: true }
        updatedAt: { type: string, format: date-time }

    SystemSetting:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        value: {}
        updatedBy: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string, nullable: true }
        actorEmail: { type: string, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        oldValues: { type: object, nullable: true }
        newValues: { type: object, nullable: true }
        ipAddress: { type: string }
        createdAt: { type: string, format: date-time }

    Proxy:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        provider: { type: string }
        type: { type: string, enum: [DATACENTER, RESIDENTIAL, MOBILE] }
        isActive: { type: boolean }
        successCount: { type: integer }
        failCount: { type: integer }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        lastFailedAt: { type: string, format: date-time, nullable: true }

    ProxyInput:
      type: object
      properties:
        url: { type: string }
        provider: { type: string, maxLength: 100 }
        type: { type: string, enum: [DATACENTER, RESIDENTIAL, MOBILE] }
        isActive: { type: boolean }

    AnalyticsOverview:
      type: object
      properties:
        totalTests: { type: integer }
        totalVendors: { type: integer }
        totalOfferings: { type: integer }
        pendingChanges: { type: integer }
        totalUsers: { type: integer }
        pageViews: { type: integer }
        searches: { type: integer }
        affiliateClicks: { type: integer }
        scrapeSuccessRate: { type: number }
        lastScrapeAt: { type: string, format: date-time, nullable: true }
