openapi: 3.1.0
info:
  title: LabPrice API
  version: "1.0.0"
  description: >
    REST API for the LabPrice blood-test price comparison platform.
    Compares self-pay prices across ordering services (not testing centers).
    See docs/04-api-design.md for full conventions.
  license:
    name: Proprietary

servers:
  - url: https://labprice.example.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local

tags:
  - name: Auth
    description: Registration, magic-link login, session management
  - name: User
    description: User profile, saved tests, alerts, GDPR
  - name: Search
    description: Full-text search and autocomplete
  - name: Catalog
    description: Tests, categories, vendors, offerings
  - name: Analytics
    description: Pageview and event logging
  - name: Admin - Catalog
    description: CRUD for tests, vendors, offerings
  - name: Admin - Changes
    description: Price change approval queue
  - name: Admin - Scraper
    description: Scrape configuration, jobs, monitoring
  - name: Admin - System
    description: Users, flags, settings, SEO, audit, proxies

security: []

paths:
  # ── Auth ────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Account created, magic link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/magic-link:
    post:
      tags: [Auth]
      summary: Send magic link email
      operationId: sendMagicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Magic link sent (always returns 200 to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/token:
    post:
      tags: [Auth]
      summary: Exchange magic link token for session
      operationId: exchangeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh session / JWT
      operationId: refreshSession
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End session
      operationId: logout
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /auth/session:
    get:
      tags: [Auth]
      summary: Get current session info
      operationId: getSession
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── User ────────────────────────────────────────────
  /me:
    get:
      tags: [User]
      summary: Get current user profile
      operationId: getMe
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [User]
      summary: Update profile
      operationId: updateMe
      security: [{ cookieAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [User]
      summary: Delete account (GDPR)
      operationId: deleteMe
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Account scheduled for deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/saved-tests:
    get:
      tags: [User]
      summary: List saved tests
      operationId: getSavedTests
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TestSummary" }
                  cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [User]
      summary: Save a test
      operationId: saveTest
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testId]
              properties:
                testId: { type: string }
      responses:
        "201":
          description: Test saved
        "409":
          description: Already saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/saved-tests/{testId}:
    delete:
      tags: [User]
      summary: Unsave a test
      operationId: unsaveTest
      security: [{ cookieAuth: [] }]
      parameters:
        - name: testId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Test unsaved
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/alerts:
    get:
      tags: [User]
      summary: List price alerts
      operationId: getAlerts
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PriceAlert" }
                  cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [User]
      summary: Create price alert
      operationId: createAlert
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testId]
              properties:
                testId: { type: string }
                vendorId: { type: string, nullable: true }
                targetPrice: { $ref: "#/components/schemas/Money" }
                thresholdPercent: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceAlert" }
        "400":
          description: Must set exactly one of targetPrice or thresholdPercent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/alerts/{id}:
    patch:
      tags: [User]
      summary: Update alert
      operationId: updateAlert
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetPrice: { $ref: "#/components/schemas/Money" }
                thresholdPercent: { type: integer, minimum: 1, maximum: 100 }
                isActive: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [User]
      summary: Delete alert
      operationId: deleteAlert
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Alert deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/notifications:
    get:
      tags: [User]
      summary: List alert notifications
      operationId: getNotifications
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlertNotification" }
                  cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/export:
    post:
      tags: [User]
      summary: GDPR data export
      operationId: exportData
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Data export as JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  savedTests: { type: array, items: { $ref: "#/components/schemas/TestSummary" } }
                  alerts: { type: array, items: { $ref: "#/components/schemas/PriceAlert" } }
                  notifications: { type: array, items: { $ref: "#/components/schemas/AlertNotification" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Search ──────────────────────────────────────────
  /search:
    get:
      tags: [Search]
      summary: Full-text search for tests
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: category
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TestSummary" }
                  cursor: { type: string, nullable: true }
                  total: { type: integer }

  /search/autocomplete:
    get:
      tags: [Search]
      summary: Typeahead suggestions (max 6)
      operationId: autocomplete
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    maxItems: 6
                    items: { $ref: "#/components/schemas/Suggestion" }

  /search/biomarkers:
    get:
      tags: [Search]
      summary: Search by biomarker
      operationId: searchBiomarkers
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        biomarker:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            unit: { type: string }
                        tests:
                          type: array
                          items: { $ref: "#/components/schemas/TestSummary" }

  # ── Catalog ─────────────────────────────────────────
  /tests:
    get:
      tags: [Catalog]
      summary: List tests
      operationId: listTests
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: popular
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, price]
            default: name
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TestSummary" }
                  cursor: { type: string, nullable: true }

  /tests/{slug}:
    get:
      tags: [Catalog]
      summary: Test detail with all offerings
      operationId: getTest
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tests/{slug}/trend:
    get:
      tags: [Catalog]
      summary: Price trend data for a test
      operationId: getTestTrend
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: days
          in: query
          schema: { type: integer, default: 90, minimum: 7, maximum: 365 }
        - name: vendorId
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  testId: { type: string }
                  points:
                    type: array
                    items: { $ref: "#/components/schemas/TrendPoint" }
        "404": { $ref: "#/components/responses/NotFound" }

  /categories:
    get:
      tags: [Catalog]
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

  /vendors:
    get:
      tags: [Catalog]
      summary: List active vendors (ordering services)
      operationId: listVendors
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vendor" }

  /vendors/{slug}:
    get:
      tags: [Catalog]
      summary: Vendor detail
      operationId: getVendor
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "404": { $ref: "#/components/responses/NotFound" }

  /go/{offeringId}:
    get:
      tags: [Catalog]
      summary: Affiliate redirect (logs click, 302 to vendor)
      operationId: affiliateRedirect
      parameters:
        - name: offeringId
          in: path
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to vendor URL
          headers:
            Location:
              schema: { type: string, format: uri }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Analytics ───────────────────────────────────────
  /analytics/pageview:
    post:
      tags: [Analytics]
      summary: Log a page view
      operationId: logPageview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, maxLength: 500 }
                testId: { type: string, nullable: true }
                sessionId: { type: string }
      responses:
        "204":
          description: Logged

  /analytics/event:
    post:
      tags: [Analytics]
      summary: Log a custom event
      operationId: logEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: { type: string, maxLength: 100 }
                properties: { type: object }
                sessionId: { type: string }
      responses:
        "204":
          description: Logged

  # ── Admin - Catalog ─────────────────────────────────
  /admin/tests:
    get:
      tags: [Admin - Catalog]
      summary: List all tests (including deleted)
      operationId: adminListTests
      security: [{ cookieAuth: [] }]
      parameters:
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TestDetail" }
                  cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin - Catalog]
      summary: Create test
      operationId: adminCreateTest
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestInput" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestDetail" }
        "400":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/tests/{id}:
    patch:
      tags: [Admin - Catalog]
      summary: Update test
      operationId: adminUpdateTest
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin - Catalog]
      summary: Soft delete test
      operationId: adminDeleteTest
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Test soft deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/vendors:
    get:
      tags: [Admin - Catalog]
      summary: List all vendors
      operationId: adminListVendors
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Vendor" }
                  cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin - Catalog]
      summary: Create vendor
      operationId: adminCreateVendor
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorInput" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/vendors/{id}:
    patch:
      tags: [Admin - Catalog]
      summary: Update vendor
      operationId: adminUpdateVendor
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin - Catalog]
      summary: Soft delete vendor
      operationId: adminDeleteVendor
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vendor soft deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/offerings:
    get:
      tags: [Admin - Catalog]
      summary: List offerings
      operationId: adminListOfferings
      security: [{ cookieAuth: [] }]
      parameters:
        - name: testId
          in: query
          schema: { type: string }
        - name: vendorId
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Offering" }
                  cursor: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin - Catalog]
      summary: Create offering
      operationId: adminCreateOffering
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingInput" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offering" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/offerings/{id}:
    patch:
      tags: [Admin - Catalog]
      summary: Update offering (manual price set)
      operationId: adminUpdateOffering
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferingInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offering" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin - Catalog]
      summary: Soft delete offering
      operationId: adminDeleteOffering
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Offering soft deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Admin - Changes ─────────────────────────────────
  /admin/changes:
    get:
